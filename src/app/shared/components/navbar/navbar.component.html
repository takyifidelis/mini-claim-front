<header class="app-topbar" role="banner">
  <div class="app-topbar__left">
    <a routerLink="/dashboard/claims" class="app-topbar__brand" aria-label="Mini Claims Register Home">
      <div class="brand-icon-box" aria-hidden="true">
        <span class="material-symbols-outlined">shield</span>
      </div>
      <div class="brand-text">
        <span class="brand-title">Claims Register</span>
        <span class="brand-subtitle"> Mini Claims Register</span>
      </div>
    </a>
  </div>

  <div class="app-topbar__right">
    <p-menu
      #profileMenu
      id="profile-menu"
      [model]="profileMenuItems"
      [popup]="true"
      appendTo="body"
    >
      <ng-template #item let-item>
        <span class="logout-menu-item cursor-pointer">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          <span>{{ item.label }}</span>
        </span>
      </ng-template>
    </p-menu>
    <button
      type="button"
      class="user-profile-menu"
      aria-label="Open user menu"
      aria-haspopup="menu"
      aria-controls="profile-menu"
      (click)="profileMenu.toggle($event)"
    >
      <div class="user-avatar" aria-hidden="true">
        <span>FM</span>
      </div>
      <div class="user-details">
        <span class="user-name">Claims Adjuster</span>
        <span class="user-role">Fidelis Mensah</span>
      </div>
      <span class="user-menu-chevron material-symbols-outlined" aria-hidden="true">
        keyboard_arrow_down
      </span>
    </button>
  </div>
</header>
