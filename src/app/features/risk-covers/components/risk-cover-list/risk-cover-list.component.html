<div class="list-page">
  <div class="list-page__header">
    <div>
      <h3 class="list-page__header-title header-title fw-bold">Risk Covers Catalogue</h3>
      <p class="list-page__header-description">
        Manage standardized risk covers available for assignment in insurance policies.
      </p>
    </div>
    <div class="list-page__header-actions">
      <a routerLink="/risk-covers/new" class="btn btn-success">
        <span>New Risk Cover</span>
      </a>
    </div>
  </div>

  <div class="list-page__content">
    <!-- Filter Toolbar -->
    <div class="filter-bar">
      <div class="filter-bar__field filter-bar__field--grow">
        <app-form-input
          label="Search"
          placeholder="Search by code or name..."
          [formControl]="searchControl"
          (blur)="applySearch()"
        />
      </div>
      <div class="filter-bar__actions">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="clearFilters()"
          [disabled]="loading()"
        >
          Clear Filters
        </button>
      </div>
    </div>

    @if (error()) {
      <div class="alert alert-danger m-3" role="alert">
        {{ error() }}
        <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="retry()">
          Retry
        </button>
      </div>
    }

    <!-- PrimeNG Table -->
    <div class="table-responsive">
      <p-table
        [value]="items()"
        [lazy]="true"
        [lazyLoadOnInit]="false"
        (onLazyLoad)="onLazyLoad($event)"
        [paginator]="true"
        [rows]="pageSize()"
        [totalRecords]="total()"
        [rowsPerPageOptions]="[5, 10, 20]"
        [loading]="loading()"
        [first]="(page() - 1) * pageSize()"
        styleClass="p-datatable-striped"
        ariaLabel="Risk Covers Table"
      >
        <ng-template #header>
          <tr>
            <th pSortableColumn="code">Code <p-sort-icon field="code" /></th>
            <th pSortableColumn="name">Name <p-sort-icon field="name" /></th>
            <th>Description</th>
            
            <th pSortableColumn="createdAt">Created Date <p-sort-icon field="createdAt" /></th>
            <th class="text-end">Actions</th>
          </tr>
        </ng-template>

        <ng-template #body let-cover>
          <tr>
            <td>
              <strong>{{ cover.code }}</strong>
            </td>
            <td>{{ cover.name }}</td>
            <td class="text-truncate" style="max-width: 250px">{{ cover.description }}</td>
            <td>{{ cover.createdAt | date: 'mediumDate' }}</td>
            <td class="text-end">
              <a
                [routerLink]="['/risk-covers', cover.id]"
                class="btn btn-sm btn-outline-success"
                [attr.aria-label]="'View details for ' + cover.name"
              >
                View
              </a>
            </td>
          </tr>
        </ng-template>

        <ng-template #emptymessage>
          <tr>
            <td colspan="7">
              <app-empty-state
                icon="shield"
                title="No risk covers found"
                description="No risk cover catalogue items match the current search or filters."
                [actionLabel]="
                  filters().search || filters().status ? 'Clear Filters' : 'Create Risk Cover'
                "
                (actionClicked)="onEmptyAction()"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
